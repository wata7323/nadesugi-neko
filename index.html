<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>10秒なですぎ猫</title>
<meta name="description" content="猫を10秒なでるだけ。なで方しだいで、猫が猫じゃなくなる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a2523; --sub:#8a7f77; --panel:#fffdf8; --accent:#f08a5d; --line:#f08a5d;
    --dot:"DotGothic16","Yu Gothic UI","Meiryo",sans-serif; --px:3px; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body{ background-color:#f7f1e8; background-size:64px 64px; image-rendering:pixelated; color:var(--ink); font-family:var(--dot); transition:background-color .5s; }
  body.dark{ --ink:#f2ede6; --sub:#b8aea6; }
  #stage{ position:fixed; inset:0; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; }
  /* ドット枠：角を1マス欠かせた太線（box-shadow で描く） */
  .pxbox{ background:var(--panel); color:#2a2523;
    box-shadow: 0 calc(-1 * var(--px)) 0 0 #2a2523, 0 var(--px) 0 0 #2a2523, calc(-1 * var(--px)) 0 0 0 #2a2523, var(--px) 0 0 0 #2a2523, 0 calc(var(--px) * 2.4) 0 0 rgba(42,37,35,.18); }
  /* 名札（形態名＋段階の星） */
  #tag{ position:absolute; left:50%; top:calc(20px + env(safe-area-inset-top)); transform:translateX(-50%); padding:6px 18px 4px; text-align:center; white-space:nowrap; pointer-events:none;
    background:var(--line); color:#fff; transition:background-color .3s; }
  #tag.pxbox{ background:var(--line); color:#fff; }
  #form{ font-size:clamp(22px, 7vw, 32px); line-height:1.15; letter-spacing:.04em; text-shadow:0 2px 0 rgba(0,0,0,.18); }
  #stars{ display:block; margin:2px auto 0; image-rendering:pixelated; }
  #tag.pop{ animation:pop .35s steps(4); }
  @keyframes pop{ 0%{ transform:translateX(-50%) scale(1.25); } 100%{ transform:translateX(-50%) scale(1); } }
  #aim{ position:absolute; left:12px; top:calc(12px + env(safe-area-inset-top)); padding:5px 5px 3px; display:flex; flex-direction:column; align-items:center; gap:3px; pointer-events:none; }
  #aim canvas{ image-rendering:pixelated; display:block; }
  #aimSil, #aimCat{ width:48px; height:48px; } #aimStars{ width:57px; height:12px; }
  #aimCat{ border-top:3px dotted rgba(42,37,35,.25); padding-top:3px; box-sizing:content-box; }
  #aim.hit{ background:#fff1a8; animation:aimhit .6s steps(6); }
  @keyframes aimhit{ 0%{ transform:scale(1.6) rotate(-10deg); } 50%{ transform:scale(.9) rotate(4deg); } 100%{ transform:none; } }
  body.res #aim{ display:none; }
  #newb{ position:absolute; right:-26px; top:-18px; padding:2px 7px 1px; font-size:15px; display:none; transform:rotate(10deg); }
  #newb.pxbox{ background:#e5484d; color:#fff; }
  #newb.on{ display:block; animation:newpop .45s steps(5); }
  @keyframes newpop{ 0%{ transform:rotate(10deg) scale(2.4); } 100%{ transform:rotate(10deg) scale(1); } }
  #tag.slam{ animation:slam .5s steps(6); }
  @keyframes slam{ 0%{ transform:translateX(-50%) scale(2) rotate(-6deg); } 55%{ transform:translateX(-50%) scale(.9) rotate(2deg); } 100%{ transform:translateX(-50%) scale(1); } }
  #zprog{ display:flex; align-items:center; gap:8px; margin-top:16px; padding:5px 12px 4px; font-size:18px; }
  #zprog img{ width:24px; height:24px; image-rendering:pixelated; }
  #zpbar{ width:110px; height:10px; background:rgba(42,37,35,.15); position:relative; }
  #zpbar i{ position:absolute; left:0; top:0; bottom:0; background:var(--line); transition:width .9s steps(9); }
  #zpnew{ color:#e5484d; }
  #coat{ display:none !important; }
  #coat{ position:absolute; left:12px; top:calc(10px + env(safe-area-inset-top)); display:flex; flex-direction:column; gap:2px; align-items:center; font-size:12px; color:var(--sub); pointer-events:none; }
  #coat img{ width:24px; height:24px; image-rendering:pixelated; }
  /* アイコンボタン */
  .ib{ width:52px; height:52px; padding:0; border:0; border-radius:0; display:grid; place-items:center; cursor:pointer; touch-action:manipulation; font-family:var(--dot); }
  .ib img{ width:36px; height:36px; image-rendering:pixelated; pointer-events:none; }
  .ib:active{ transform:translateY(var(--px)); }
  .ib.main{ width:auto; padding:0 26px; background:var(--accent); }
  .ib.main img{ width:42px; height:42px; }
  .ib.new::after{ content:""; position:absolute; margin:-40px 0 0 40px; width:10px; height:10px; background:#e5484d; }
  #pre{ position:absolute; left:0; right:0; display:flex; justify-content:center; gap:20px; }
  #rs{ position:absolute; right:14px; top:calc(10px + env(safe-area-inset-top)); width:40px; height:40px; display:none; }
  #rs img{ width:24px; height:24px; }
  #ctrl{ position:absolute; left:0; right:0; bottom:0; height:calc(64px + env(safe-area-inset-bottom)); pointer-events:none; }
  /* 重ねる画面 */
  .ov{ position:fixed; inset:0; display:none; background:rgba(42,37,35,.6); z-index:10; padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom)); }
  #howto, #zukan{ z-index:12; }
  body.res #stage{ visibility:hidden; }
  #result{ background:transparent; }
  .ov.on{ display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .sheet{ width:min(420px, 100%); max-height:100%; overflow:auto; padding:18px 16px; }
  .how{ display:grid; gap:18px; justify-items:center; text-align:center; font-size:18px; }
  .how canvas{ image-rendering:pixelated; display:block; margin:0 auto 4px; }
  .ver{ margin-top:14px; font-size:11px; color:#8a7f77; text-align:center; }
  .ver a{ color:#8a7f77; }
  .zhead{ display:flex; justify-content:center; align-items:center; gap:10px; font-size:22px; margin-bottom:12px; }
  .zhead img{ width:36px; height:36px; image-rendering:pixelated; }
  .zrow{ display:flex; gap:8px; align-items:flex-start; margin-bottom:10px; }
  .zrow > img{ width:24px; height:24px; image-rendering:pixelated; margin-top:16px; flex:0 0 auto; }
  .zrow .zg{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; flex:1; }
  .zg figure{ margin:0; text-align:center; font-size:10px; line-height:1.25; color:#2a2523; }
  .zg canvas{ width:100%; image-rendering:pixelated; display:block; }
  .zclose{ display:flex; justify-content:center; margin-top:8px; }
  #result .card{ display:block; width:auto; height:auto; max-width:min(400px, 100%); max-height:calc(100% - 160px); aspect-ratio:3/4; }
  #result .rbtns{ display:flex; gap:18px; margin-top:22px; align-items:center; }
  #wipe{ position:fixed; inset:0; z-index:20; pointer-events:none; display:grid; grid-template-columns:repeat(8, 1fr); }
  #wipe i{ background:#2a2523; transform:scaleY(0); transform-origin:top; transition:transform .16s steps(4); }
  #wipe.on i{ transform:scaleY(1); }
  #toast{ position:fixed; left:50%; bottom:calc(110px + env(safe-area-inset-bottom)); transform:translateX(-50%); padding:8px 14px; font-size:14px; z-index:30; display:none; white-space:nowrap; }
  #dbg{ position:fixed; left:4px; top:120px; z-index:40; font:11px/1.35 ui-monospace,Consolas,monospace; background:rgba(0,0,0,.72); color:#cfe; padding:6px 8px; white-space:pre; pointer-events:none; display:none; }
</style>

<script src="sprites.js"></script>
<script>
'use strict';
const { FORMS, LINES, COATS, STYLES, STYLE_BG, render, drawStyled } = CatSprites;
const APP_VER = '0.3.0';

/*SIM-START*/
// ---------- 調整用の数値（ここだけ触れば手ざわりが変わる） ----------
const P = {
  time: 10,                 // 1プレイの秒数（触った瞬間から）
  slow: 28, fast: 95,       // なでる速さの境目（猫の絵の48マス単位／秒）
  // とろけ系：あご・ほっぺをゆっくり
  melt: { chin:1.0, head:.35, ear:.1, body:.15, belly:0 }, meltSpeed: [2.6, 1.0, .15],   // [ゆっくり, ふつう, はやい]
  // のびる系：胴を長いストロークで
  longSeg: { body:.3 }, longStrokeMin: 22, longStroke: 1.1,
  // 妖系：耳
  yokai: { ear:2.4, head:.15 },
  // 帯電系：速い往復・逆なで
  elecFast: .45, elecUp: 1.6, elecRev: 5,
  // 怒り系：お腹＋猫パンチ
  angryBelly: 1.5, bellyRun: 8, punchAngry: 45,   // お腹は「そこに留まって」なでたときだけ（通り過ぎは数えない）
  // 放置系：触ってから手を離して待つ（1秒あたり）
  idleRate: 42, idleGrace: .5,   // 手を離して .5 秒たってから数える
  // 気持ち
  purrGain: { chin:.5, head:.45, ear:.4, body:.4, belly:0 }, purrDecay: 9, purrBoost: .8,
  irrBelly: .9, irrFast: .08, irrUp: .1, irrDecay: 7, punchLock: 1.0,
  // 進化のしきい値（その系統の点数）
  stage: [55, 140, 260, 400], idleStage: [60, 170, 320],
  // 隠し・ミーム
  uchu: 70, gainen: 140,
  memeSpinTurns: 3, memeTaps: 12, memeStill: 2.5, memePunch: 5, memeHappyPurr: 90, memeHappyIrr: 35,
  feverMul: 1.6, feverTime: 2.5, spotNeed: 3,   // キラキラを3回なでるとフィーバー（2.5秒、伸びが1.6倍）
  memeNakiPurr: 55, memeNakiIdle: 3.5, memeHappyRegions: 4, memeJouhinDist: 60, memeJouhinMaxV: 60, memeJouhinHead: .8,
};
const SYS = ['melt', 'long', 'yokai', 'elec', 'angry'];
const LINE_FORMS = {
  melt:['yurumi','liquid','gas','cloud'], long:['dounaga','hamidashi','kaigyo','chikyu'], yokai:['ware','nekomata','kyubi','nekogami'],
  elec:['sakadachi','kedama','kaminari','hatsuden'], angry:['ikamimi','kamu','tora','kaiju'], idle:['koubako','hako','hakodake'],
};
// 48マス座標でなでた場所を判定（正面の座り姿が基準）
function region(u, v){
  const hx = (u - 24) / 12, hy = (v - 19) / 9.5, bx = (u - 24) / 12, by = (v - 35) / 10;
  if (v < 12 && Math.abs(u - 24) > 3 && Math.abs(u - 24) < 14) return 'ear';
  if (hx * hx + hy * hy <= 1) return v < 20 ? 'head' : 'chin';
  if (Math.abs(u - 24) < 6 && v > 29 && v < 44) return 'belly';
  if (bx * bx + by * by <= 1 || (v > 40 && v < 47 && Math.abs(u - 24) < 9)) return 'body';
  return null;
}
function newSim(coat){
  return { t:0, started:false, over:false, coat, score:{ melt:0, long:0, yokai:0, elec:0, angry:0, idle:0 },
    purr:0, purrPeak:0, irr:0, irrPeak:0, punch:0, lock:0, dist:0, strokes:0, nade:0, segLen:0, taps:0, tapRegions:{}, fever:0, still:0, spin:0, maxV:0,
    regionDist:{ ear:0, head:0, chin:0, body:0, belly:0 }, bellyRun:0, lastTouch:0, down:false, stroke:null, prevDir:null, prevAng:null, line:'start', stage:0 };
}
// 指の移動1回ぶん（u,v は48マス座標、dt 秒）
function simMove(s, u0, v0, u1, v1, dt){
  if (s.over || s.lock > 0) return;
  const dx = u1 - u0, dy = v1 - v0, d = Math.hypot(dx, dy); const v = d / Math.max(dt, 1e-3);
  if (s.stroke){ s.stroke.len += d; }
  // 回転（猫の中心まわりの角度）
  const ang = Math.atan2(v1 - 30, u1 - 24), rr = Math.hypot(u1 - 24, v1 - 30);
  if (s.prevAng !== null && rr > 8){ let da = ang - s.prevAng; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI; s.spin += da; }
  s.prevAng = ang;
  s.stillRun = v < 2 ? (s.stillRun || 0) + dt : 0; if (s.stillRun > .4) s.still += dt;
  if (d < .05) return;
  const r = region(u1, v1); if (!r) return;
  s.dist += d; s.maxV = Math.max(s.maxV, v); s.regionDist[r] += d;
  const sp = v < P.slow ? 0 : v < P.fast ? 1 : 2, up = dy < -d * .4;
  const boost = (1 + s.purr / 100 * P.purrBoost) * (s.fever > 0 ? P.feverMul : 1);
  s.score.melt += d * (P.melt[r] || 0) * P.meltSpeed[sp] * boost;
  s.score.long += d * (P.longSeg[r] || 0) * boost;
  s.score.yokai += d * (P.yokai[r] || 0) * boost;
  if (sp === 2) s.score.elec += d * P.elecFast * (up ? P.elecUp : 1) * boost;
  s.bellyRun = r === 'belly' ? s.bellyRun + d : 0; const inBelly = s.bellyRun > P.bellyRun;
  if (inBelly) s.score.angry += d * P.angryBelly * boost;
  // 往復（向きが反対になった）
  const dir = [dx / d, dy / d];
  const back = s.prevDir && dir[0] * s.prevDir[0] + dir[1] * s.prevDir[1] < -.3;
  if (back && s.segLen > 4){ s.nade++; s.segLen = 0; }   // 往復1回＝1なで
  s.segLen += d;
  if (back && sp === 2) s.score.elec += P.elecRev * boost;
  s.prevDir = dir;
  // 気持ち
  if (sp < 2 && !up) s.purr = Math.min(100, s.purr + d * (P.purrGain[r] || 0));
  s.irr += d * ((inBelly ? P.irrBelly : 0) + (sp === 2 ? P.irrFast : 0) + (up ? P.irrUp : 0));
  s.purrPeak = Math.max(s.purrPeak, s.purr);
  if (s.irr >= 100){ s.irr = 30; s.punch++; s.score.angry += P.punchAngry; s.lock = P.punchLock; s.punched = true; }
  s.irrPeak = Math.max(s.irrPeak, s.irr);
}
function simDown(s){ if (s.over) return; s.down = true; s.stroke = { len:0, t:s.t }; s.prevDir = null; s.prevAng = null; s.lastTouch = s.t; }
function simUp(s, u, v){
  if (!s.stroke) return; const st = s.stroke; s.stroke = null; s.down = false; s.lastTouch = s.t;
  if (s.over) return;
  if (st.len > 2){ s.strokes++; if (s.segLen > 4) s.nade++; s.segLen = 0; }
  if (s.t - st.t < .22 && st.len < 3){ s.taps++; const r = region(u, v); if (r) s.tapRegions[r] = 1; }
  if (st.len > P.longStrokeMin && s.lock <= 0) s.score.long += (st.len - P.longStrokeMin * .8) * P.longStroke * (1 + s.purr / 100 * P.purrBoost);
}
function simTick(s, dt){
  if (!s.started || s.over) return;
  s.t += dt; s.lock = Math.max(0, s.lock - dt); s.fever = Math.max(0, (s.fever || 0) - dt);
  if (!s.down){ if (s.t - s.lastTouch > P.idleGrace) s.score.idle += P.idleRate * dt; s.purr = Math.max(0, s.purr - P.purrDecay * dt); }
  s.irr = Math.max(0, s.irr - P.irrDecay * dt);
  const lv = liveForm(s); s.line = lv.line; s.stage = lv.stage; s.form = lv.form;
  if (s.t >= P.time){ s.t = P.time; s.over = true; }
}
function liveForm(s){
  let best = 'melt'; for (const k of SYS) if (s.score[k] > s.score[best]) best = k;
  let line = best, val = s.score[best], th = P.stage;
  if (s.score.idle > val && s.started){ line = 'idle'; val = s.score.idle; th = P.idleStage; }
  let stage = 0; for (let i = 0; i < th.length; i++) if (val >= th[i]) stage = i + 1;
  if (!stage) return { line:'start', stage:0, form:'normal' };
  return { line, stage, form: LINE_FORMS[line][stage - 1] };
}
// 時間切れのときの最終判定（隠し・ミームが上書きする）
function finalForm(s){
  const mn = Math.min(...SYS.map(k => s.score[k]));
  const idleEnd = s.down ? 0 : s.t - s.lastTouch;
  const tr = s.tapRegions, allTap = ['ear','head','chin','body','belly'].every(k => tr[k]);
  if (mn >= P.gainen) return { form:'gainen', why:'全部の系統をまんべんなく、たっぷり' };
  if (mn >= P.uchu) return { form:'uchu', why:'全部の系統をまんべんなく' };
  if (s.still >= P.memeStill) return { form:'magao', why:'じっと押さえ続けた' };
  if (Math.abs(s.spin) >= P.memeSpinTurns * 2 * Math.PI) return { form:'spin', why:'ぐるぐる円を描いた' };
  if (allTap) return { form:'yoshi', why:'耳・頭・あご・胴・お腹を全部タップ' };
  if (s.punch >= P.memePunch) return { form:'banana', why:`猫パンチを${s.punch}回くらった` };
  if (s.taps >= P.memeTaps) return { form:'pop', why:'ポンポン連打した' };
  if (s.purrPeak >= P.memeNakiPurr && idleEnd >= P.memeNakiIdle) return { form:'naki', why:'気持ちよくさせて、急にやめた' };
  const many = Object.values(s.regionDist).filter(v => v >= 15).length;
  if (s.purr >= P.memeHappyPurr && s.irrPeak < P.memeHappyIrr && many >= P.memeHappyRegions && liveForm(s).stage <= 1) return { form:'happy', why:'いろんな所を、ちょうどよく' };
  if (s.dist >= P.memeJouhinDist && s.maxV < P.memeJouhinMaxV && s.regionDist.head >= s.dist * P.memeJouhinHead) return { form:'jouhin', why:'頭だけを、ゆっくりやさしく' };
  const lv = liveForm(s); return { form: lv.form, why:null };
}
/*SIM-END*/

// ---------- アイコン（12×12 のドット。# は指定色、英字は別色） ----------
const ICONS = {
  heart:['............','..##....##..','.####..####.','############','############','############','.##########.','..########..','...######...','....####....','.....##.....','............'],
  melt:['.....##.....','.....##.....','....####....','....####....','...######...','..########..','..########..','.##########.','.##########.','.##########.','..########..','...######...'],
  long:['.....##.....','....####....','...######...','..##.##.##..','.....##.....','.....##.....','.....##.....','.....##.....','..##.##.##..','...######...','....####....','.....##.....'],

    if (resultInfo.aim) stamp(x, 'ねらいどおり！', '#e0a800', 270, 250, -.12, 1 + k * 1.5);
    if (t < 2.4 && (resultInfo.isNew || resultInfo.aim)){ const cols = ['#e5484d', '#ffd84a', '#5aa7dc', '#4fb878', '#f28fa0', lc];
      for (let i = 0; i < 70; i++){ const sx = (i * 137.5) % CW, sp = 380 + (i * 53) % 300, y = -40 + (t - .9) * sp + ((i * 71) % 200) - 200, w = Math.sin(t * 6 + i) * 30;
        x.fillStyle = cols[i % cols.length]; x.fillRect(Math.round((sx + w) / 12) * 12, Math.round(y / 12) * 12, 24, 12 + (i % 2) * 12); } } }
  x.textAlign = 'right'; const d = new Date(); x.fillText(`${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`, CW - 56, 1400);
}
function stamp(x, txt, col, cx, cy, rot, sc){
  x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(sc, sc); x.font = '64px DotGothic16'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const w = x.measureText(txt).width + 48; x.fillStyle = '#2a2523'; x.fillRect(-w / 2 - 8, -44, w + 16, 88); x.fillStyle = col; x.fillRect(-w / 2, -36, w, 72);
  x.fillStyle = '#ffffff'; x.fillText(txt, 0, 2); x.restore();
}
function zProg(animate){
  let got = 0; const z = zData(), all = FORMS.length; for (const f of FORMS) if (z[f.id]) got++;
  const before = got - newThisRound.length; $('zpn').textContent = `${animate ? got : before} / ${all}`;
  $('zpbar').firstElementChild.style.width = ((animate ? got : before) / all * 100) + '%';
  $('zpnew').textContent = animate && newThisRound.length ? `+${newThisRound.length}` : '';
}
function shareText(){ const fm = FORM(resultInfo.form); return `うちの${COATS[resultInfo.sim.coat].name}、10秒なでたら「${fm.name}」になりました\n\n#10秒なですぎ猫`; }
async function pngFile(){ const url = cardPNG || $('card').toDataURL('image/png'); const b = await (await fetch(url)).blob(); return new File([b], 'nadesugi_neko.png', { type:'image/png' }); }
const coarse = matchMedia('(pointer:coarse)').matches;
async function shareX(){
  sfx.click();
  try { const file = await pngFile(); if (coarse && navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], text:shareText() }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  try { const file = await pngFile(); await navigator.clipboard.write([new ClipboardItem({ 'image/png': file })]); toast('画像をコピーしました'); } catch(e){}
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(shareText()), '_blank', 'noopener');
}
async function saveImg(){
  sfx.click(); const file = await pngFile();
  try { if (coarse && navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function retry(){ sfx.click(); wipe(true); setTimeout(() => { $('result').classList.remove('on'); document.body.classList.remove('res'); newRound(); wipe(false); }, 200); }
let toastT = 0; function toast(t){ const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 2200); }

// ---------- 図鑑 ----------
function zData(){ return LS.get('neko_zukan_v1', {}); }
function zRecord(id, coat){ const z = zData(); if (!z[id]){ z[id] = { coat, d:Date.now() }; LS.set('neko_zukan_v1', z); LS.set('neko_zukan_new', true); markNew(); } }
function markNew(){ const n = LS.get('neko_zukan_new', false); $('zbtn').classList.toggle('new', n); $('zbtn2').classList.toggle('new', n); }
const Z_ICON = { start:'paw', melt:'melt', long:'long', yokai:'yokai', elec:'elec', angry:'angry', idle:'idle', secret:'secret', meme:'meme' };
function zOpen(){
  sfx.click(); LS.set('neko_zukan_new', false); markNew(); const z = zData(); const grid = $('zgrid'); grid.innerHTML = '';
  let got = 0, all = 0;
  for (const l of LINES){ const fs = FORMS.filter(f => f.line === l.key); if (!fs.length) continue;
    const row = document.createElement('div'); row.className = 'zrow'; const ic = document.createElement('img'); ic.src = iconURL(Z_ICON[l.key], LINE_COLOR[l.key], 2); row.appendChild(ic);
    const g = document.createElement('div'); g.className = 'zg'; row.appendChild(g);
    for (const f of fs){ all++; const has = !!z[f.id]; if (has) got++;
      const fig = document.createElement('figure'); const c = document.createElement('canvas'); c.width = c.height = 96; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
      x.drawImage(drawStyled(render(f.id, 48, 0, has ? z[f.id].coat : 'tora'), 2, 'std', { noBg:true, silhouette: has ? null : '#d8cfc3' }), 0, 0);
      fig.appendChild(c); if (has){ const cap = document.createElement('figcaption'); cap.textContent = f.name; fig.appendChild(cap); } g.appendChild(fig); }
    grid.appendChild(row); }
  $('zsum').textContent = `${got} / ${all}`;
  $('zukan').classList.add('on');
}

// ---------- 遊び方（絵で見せる） ----------
function howBuild(){
  const el = $('howList'); el.innerHTML = '';
  const add = (draw, w, h, cap) => { const d = document.createElement('div'); const c = document.createElement('canvas'); c.width = w; c.height = h; c.style.width = w / 2 + 'px'; c.style.height = h / 2 + 'px';
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false; draw(x); d.appendChild(c); const s = document.createElement('div'); s.textContent = cap; d.appendChild(s); el.appendChild(d); };
  add(x => { x.drawImage(drawStyled(render('normal', 48, 0, 'tora'), 4, 'std', { noBg:true }), 0, 0); const old = ctx; for (const r of [26, 40]){ x.fillStyle = '#f08a5d'; const n = 28; for (let i = 0; i < n; i++){ const a = i / n * 6.283; x.fillRect(Math.round((96 + Math.cos(a) * r) / 4) * 4, Math.round((96 + Math.sin(a) * r) / 4) * 4, 4, 4); } }
    x.drawImage(drawStyled(render('liquid', 48, 0, 'tora'), 4, 'std', { noBg:true }), 260, 0); drawIcon(x, 'long', 205, 70, 4, '#2a2523'); }, 452, 192, 'なでる');
  add(x => { ['melt', 'long', 'yokai', 'elec', 'angry', 'idle'].forEach((k, i) => drawIcon(x, k, i * 64, 0, 4, LINE_COLOR[k])); }, 376, 48, 'なで方で変わる');
  add(x => { for (let i = 0; i < 10; i++) drawIcon(x, 'paw', i * 40, 0, 3, i < 7 ? '#f08a5d' : 'rgba(42,37,35,.15)'); }, 396, 36, '10秒');
  add(x => { x.drawImage(drawStyled(render('nekomata', 48, 0, 'tora'), 2, 'std', { noBg:true, silhouette:'#5b524c' }), 0, 0); drawIcon(x, 'book', 120, 24, 4, '#2a2523'); }, 168, 96, 'ねらう・あつめる');
  add(x => { const pat = PAT.spark; for (let n = 0; n < 3; n++){ x.fillStyle = '#ffd84a'; pat.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '#') x.fillRect(n * 56 + i * 8, j * 8, 8, 8); })); } drawIcon(x, 'star', 180, 0, 4, '#e5484d'); }, 228, 48, 'キラキラ×3');
  add(x => { drawIcon(x, 'angry', 0, 0, 4, '#e5484d'); drawIcon(x, 'claw', 64, 0, 4, '#2a2523'); }, 112, 48, 'なですぎ注意');
}
function hOpen(){ sfx.click(); $('howto').classList.add('on'); }
$('howto').addEventListener('pointerdown', e => { e.stopPropagation(); $('howto').classList.remove('on'); LS.set('neko_howto_v1', 1); });

// ---------- ボタン ----------
for (const el of document.querySelectorAll('button, .ov')) el.addEventListener('pointerdown', e => e.stopPropagation());
$('hbtn').onclick = hOpen;
$('zbtn').onclick = zOpen; $('zbtn2').onclick = zOpen; $('zclose').onclick = () => { sfx.click(); $('zukan').classList.remove('on'); };
$('zukan').addEventListener('click', e => { if (e.target.id === 'zukan') $('zukan').classList.remove('on'); });
$('sbtn').onclick = () => { audioInit(); setSound(!sound); sfx.click(); };
$('stbtn').onclick = () => { const i = STYLES.findIndex(s => s.id === style); style = STYLES[(i + 1) % STYLES.length].id; LS.set('neko_style', style); setTint(S.line); toast(STYLES.find(s => s.id === style).name); sfx.click(); };
$('rs').onclick = () => retry();
$('retry').onclick = retry; $('xbtn').onclick = shareX; $('save').onclick = saveImg;
$('card').addEventListener('pointerdown', () => { if (revealT < .9) skipReveal = true; });

// ---------- 作者用デバッグ（手元のファイルか localhost のときだけ） ----------
const DBG = { on:false };
if (/[?&]debug/.test(location.search) && (location.protocol === 'file:' || /^(localhost|127\.)/.test(location.hostname))) DBG.on = true;
function dbgDraw(){
  const s = S; const el = $('dbg'); el.style.display = 'block';
  el.textContent = Object.entries(s.score).map(([k, v]) => `${k.padEnd(6)} ${v.toFixed(0).padStart(4)}`).join('\n') +
    `\npurr ${s.purr.toFixed(0)} irr ${s.irr.toFixed(0)} punch ${s.punch}\ndist ${s.dist.toFixed(0)} nade ${s.nade} taps ${s.taps}\nstill ${s.still.toFixed(1)} spin ${(s.spin / 6.283).toFixed(1)} maxV ${s.maxV.toFixed(0)}\n→ ${s.form} / final ${finalForm(s).form}`;
}

// ---------- はじめ ----------
paintIcons(); setSound(sound); howBuild(); newRound(); markNew();
document.fonts.load('20px DotGothic16').finally(resize); resize();
if (!LS.get('neko_howto_v1', 0)) $('howto').classList.add('on');
if (DBG.on){ const q = new URLSearchParams(location.search);
  if (q.get('nohow') !== null) $('howto').classList.remove('on');
  if (q.get('result')){ $('howto').classList.remove('on'); start(); S.dist = 412; S.nade = 52; S.taps = 3; S.regionDist.chin = 300; S.t = P.time;
    setTimeout(() => { phase = 'firing'; resultInfo = { form:q.get('result'), why:null, sim:S }; showResult(); }, 300); }
  if (q.get('play')){ $('howto').classList.remove('on'); start(); const f = q.get('play'); S.form = f; prevForm = f; S.line = FORM(f).line; setTag(f); setTint(S.line); S.t = 4.2; S.purr = 72; S.irr = 75; S.score.melt = 230; S.score.yokai = 60; } }
requestAnimationFrame(frame);
</script>
