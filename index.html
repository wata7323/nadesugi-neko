<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>10秒なですぎ猫</title>
<meta name="description" content="猫を10秒なでるだけ。なで方しだいで、猫が猫じゃなくなる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a2523; --sub:#7a6f68; --tint:#f7f1e8; --accent:#e0794a; --red:#d94b3d; --panel:#fffdf8;
    --dot:"DotGothic16","Yu Gothic UI","Meiryo",sans-serif; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body{ background:var(--tint); color:var(--ink); font-family:var(--dot); transition:background-color .5s; }
  body.dark{ --ink:#f2ede6; --sub:#b8aea6; --panel:#1d1a24; }
  #stage{ position:fixed; inset:0; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  /* 上：HUD */
  #hud{ position:absolute; left:0; right:0; top:0; padding:calc(10px + env(safe-area-inset-top)) 16px 0; text-align:center; pointer-events:none; }
  #tline{ position:absolute; left:0; top:0; height:4px; background:var(--accent); width:100%; transform-origin:left; }
  .row1{ display:flex; justify-content:space-between; font-size:14px; color:var(--sub); }
  .row1 b{ font-weight:normal; color:var(--ink); font-variant-numeric:tabular-nums; }
  .row1 b.hurry{ color:var(--red); }
  #form{ font-size:clamp(28px, 9vw, 46px); line-height:1.2; margin-top:4px; letter-spacing:.04em; }
  #status{ font-size:15px; min-height:1.4em; color:var(--sub); }
  #status.alert{ color:var(--red); }
  /* 下：系統ゲージ */
  #ctrl{ position:absolute; left:0; right:0; bottom:0; padding:8px 16px calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }
  .moods{ display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; margin-bottom:8px; }
  .lines{ display:grid; grid-template-columns:repeat(3, 1fr); gap:4px 12px; }
  .g{ font-size:12px; color:var(--sub); }
  .g .bar{ height:8px; border:2px solid var(--ink); margin-top:2px; background:var(--panel); }
  .g .bar i{ display:block; height:100%; width:0; background:var(--c, var(--ink)); }
  .g.lead{ color:var(--ink); }
  /* ボタン（ドット風：角なし・太線） */
  .btns{ position:absolute; left:0; right:0; display:flex; justify-content:center; gap:8px; }
  #pre{ bottom:calc(150px + env(safe-area-inset-bottom)); }
  button{ font-family:var(--dot); font-size:15px; color:var(--ink); background:var(--panel); border:2px solid var(--ink); border-radius:0; padding:7px 12px; box-shadow:3px 3px 0 var(--ink); cursor:pointer; touch-action:manipulation; }
  button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  button.main{ background:var(--accent); color:#fff; font-size:18px; padding:10px 22px; }
  .dot-new{ position:relative; } .dot-new::after{ content:""; position:absolute; right:-5px; top:-5px; width:9px; height:9px; background:var(--red); }
  #rs{ position:absolute; right:12px; top:calc(40px + env(safe-area-inset-top)); display:none; font-size:12px; padding:4px 8px; box-shadow:2px 2px 0 var(--ink); }
  /* 重ねる画面 */
  .ov{ position:fixed; inset:0; display:none; background:rgba(20,16,14,.55); z-index:10; padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)); }
  .ov.on{ display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .sheet{ background:var(--panel); border:3px solid var(--ink); box-shadow:6px 6px 0 rgba(0,0,0,.35); width:min(440px, 100%); max-height:100%; overflow:auto; padding:16px; color:var(--ink); }
  .sheet h2{ margin:0 0 10px; font-weight:normal; font-size:22px; text-align:center; }
  .how{ display:grid; gap:12px; }
  .how div{ display:flex; gap:12px; align-items:center; font-size:15px; line-height:1.5; }
  .how canvas{ flex:0 0 auto; image-rendering:pixelated; }
  .how small{ color:var(--sub); font-size:12px; display:block; }
  .ver{ margin-top:12px; font-size:11px; color:var(--sub); text-align:right; }
  .ver a{ color:var(--sub); }
  #zgrid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  #zgrid figure{ margin:0; text-align:center; font-size:10px; line-height:1.3; }
  #zgrid canvas{ width:100%; image-rendering:pixelated; background:#f4efe6; border:2px solid var(--ink); }
  #zgrid figure.no{ color:var(--sub); }
  .zsum{ text-align:center; font-size:13px; color:var(--sub); margin:-4px 0 10px; }
  #result .card{ width:auto; max-width:min(440px, 100%); max-height:calc(100% - 120px); aspect-ratio:3/4; border:3px solid var(--ink); background:#fff; box-shadow:6px 6px 0 rgba(0,0,0,.35); }
  #result .rbtns{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  #result .rbtns button{ min-width:64px; }
  #result .rbtns button.main{ min-width:120px; }
  #wipe{ position:fixed; inset:0; z-index:20; pointer-events:none; display:grid; grid-template-columns:repeat(8, 1fr); grid-auto-rows:1fr; }
  #wipe i{ background:var(--ink); transform:scaleY(0); transform-origin:top; transition:transform .16s steps(4); }
  #wipe.on i{ transform:scaleY(1); }
  #toast{ position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--panel); padding:8px 14px; font-size:14px; z-index:30; display:none; white-space:nowrap; }
  #dbg{ position:fixed; left:4px; top:120px; z-index:40; font:11px/1.35 ui-monospace,Consolas,monospace; background:rgba(0,0,0,.72); color:#cfe; padding:6px 8px; white-space:pre; pointer-events:none; display:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="tline"></div>
  <div id="hud">
    <div class="row1"><span id="lineName">今日の猫：茶トラ</span><span>残り <b id="time">10.00</b></span></div>
    <div id="form">ふつうの猫</div>

  </div>
  <button id="rs">やり直す</button>
  <div class="btns" id="pre">
    <button id="hbtn">遊び方</button><button id="zbtn">図鑑</button><button id="stbtn">描き方</button><button id="sbtn">音 ON</button>
  </div>
  <div id="ctrl">
    <div class="moods">
      <div class="g"><span>ゴロゴロ</span><div class="bar"><i id="mPurr" style="--c:#e0794a"></i></div></div>
      <div class="g"><span>イライラ</span><div class="bar"><i id="mIrr" style="--c:#d94b3d"></i></div></div>
    </div>
    <div class="lines" id="lines"></div>
  </div>
</div>

<div class="ov" id="howto"><div class="sheet">
  <h2>遊び方</h2>
  <div class="how" id="howList"></div>
  <p style="text-align:center;margin:14px 0 0;color:var(--sub);font-size:13px">どこを触っても閉じます</p>
  <div class="ver">わた｜ver. 0.1.0　<a href="https://x.com/watawatasuruwat" target="_blank" rel="noopener">X:@watawatasuruwat</a></div>
</div></div>

<div class="ov" id="zukan"><div class="sheet">
  <h2>図鑑</h2>
  <div class="zsum" id="zsum"></div>
  <div id="zgrid"></div>
  <p style="text-align:center;margin:12px 0 0"><button id="zclose">閉じる</button></p>
</div></div>

<div class="ov" id="result">
  <canvas class="card" id="card" width="1080" height="1440"></canvas>
  <div class="rbtns">
    <button id="xbtn">ポスト</button><button id="save">保存</button><button id="zbtn2">図鑑</button><button id="retry" class="main">もう一回</button>
  </div>
</div>

<div id="wipe"></div>
<div id="toast"></div>

<script src="sprites.js"></script>
<script>
'use strict';
const { FORMS, LINES, COATS, STYLES, STYLE_BG, render, drawStyled } = CatSprites;
const APP_VER = '0.1.0';

/*SIM-START*/
// ---------- 調整用の数値（ここだけ触れば手ざわりが変わる） ----------
const P = {
  time: 10,                 // 1プレイの秒数（触った瞬間から）
  slow: 28, fast: 95,       // なでる速さの境目（猫の絵の48マス単位／秒）
  // とろけ系：あご・ほっぺをゆっくり
  melt: { chin:1.0, head:.35, ear:.1, body:.15, belly:0 }, meltSpeed: [2.6, 1.0, .15],   // [ゆっくり, ふつう, はやい]
  // のびる系：胴を長いストロークで
  longSeg: { body:.3 }, longStrokeMin: 22, longStroke: 1.1,
  // 妖系：耳
  yokai: { ear:2.4, head:.15 },
  // 帯電系：速い往復・逆なで
  elecFast: .45, elecUp: 1.6, elecRev: 5,
  // 怒り系：お腹＋猫パンチ
  angryBelly: 1.5, bellyRun: 8, punchAngry: 45,   // お腹は「そこに留まって」なでたときだけ（通り過ぎは数えない）
  // 放置系：触ってから手を離して待つ（1秒あたり）
  idleRate: 42, idleGrace: .5,   // 手を離して .5 秒たってから数える
  // 気持ち
  purrGain: { chin:.5, head:.45, ear:.4, body:.4, belly:0 }, purrDecay: 9, purrBoost: .8,
  irrBelly: .9, irrFast: .08, irrUp: .1, irrDecay: 7, punchLock: 1.0,
  // 進化のしきい値（その系統の点数）
  stage: [55, 140, 260, 400], idleStage: [60, 170, 320],
  // 隠し・ミーム
  uchu: 70, gainen: 140,
  memeSpinTurns: 3, memeTaps: 12, memeStill: 2.5, memePunch: 5, memeHappyPurr: 90, memeHappyIrr: 35,
  memeNakiPurr: 55, memeNakiIdle: 3.5, memeHappyRegions: 4, memeJouhinDist: 60, memeJouhinMaxV: 60, memeJouhinHead: .8,
};
const SYS = ['melt', 'long', 'yokai', 'elec', 'angry'];
const LINE_FORMS = {
  melt:['yurumi','liquid','gas','cloud'], long:['dounaga','hamidashi','kaigyo','chikyu'], yokai:['ware','nekomata','kyubi','nekogami'],
  elec:['sakadachi','kedama','kaminari','hatsuden'], angry:['ikamimi','kamu','tora','kaiju'], idle:['koubako','hako','hakodake'],
};
// 48マス座標でなでた場所を判定（正面の座り姿が基準）
function region(u, v){
  const hx = (u - 24) / 12, hy = (v - 19) / 9.5, bx = (u - 24) / 12, by = (v - 35) / 10;
  if (v < 12 && Math.abs(u - 24) > 3 && Math.abs(u - 24) < 14) return 'ear';
  if (hx * hx + hy * hy <= 1) return v < 20 ? 'head' : 'chin';
  if (Math.abs(u - 24) < 6 && v > 29 && v < 44) return 'belly';
  if (bx * bx + by * by <= 1 || (v > 40 && v < 47 && Math.abs(u - 24) < 9)) return 'body';
  return null;
}
function newSim(coat){
  return { t:0, started:false, over:false, coat, score:{ melt:0, long:0, yokai:0, elec:0, angry:0, idle:0 },
    purr:0, purrPeak:0, irr:0, irrPeak:0, punch:0, lock:0, dist:0, strokes:0, nade:0, segLen:0, taps:0, tapRegions:{}, still:0, spin:0, maxV:0,
    regionDist:{ ear:0, head:0, chin:0, body:0, belly:0 }, bellyRun:0, lastTouch:0, down:false, stroke:null, prevDir:null, prevAng:null, line:'start', stage:0 };
}
// 指の移動1回ぶん（u,v は48マス座標、dt 秒）
function simMove(s, u0, v0, u1, v1, dt){
  if (s.over || s.lock > 0) return;
  const dx = u1 - u0, dy = v1 - v0, d = Math.hypot(dx, dy); const v = d / Math.max(dt, 1e-3);
  if (s.stroke){ s.stroke.len += d; }
  // 回転（猫の中心まわりの角度）
  const ang = Math.atan2(v1 - 30, u1 - 24), rr = Math.hypot(u1 - 24, v1 - 30);
  if (s.prevAng !== null && rr > 8){ let da = ang - s.prevAng; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI; s.spin += da; }
  s.prevAng = ang;
  s.stillRun = v < 2 ? (s.stillRun || 0) + dt : 0; if (s.stillRun > .4) s.still += dt;
  if (d < .05) return;
  const r = region(u1, v1); if (!r) return;
  s.dist += d; s.maxV = Math.max(s.maxV, v); s.regionDist[r] += d;
  const sp = v < P.slow ? 0 : v < P.fast ? 1 : 2, up = dy < -d * .4;
  const boost = 1 + s.purr / 100 * P.purrBoost;
  s.score.melt += d * (P.melt[r] || 0) * P.meltSpeed[sp] * boost;
  s.score.long += d * (P.longSeg[r] || 0) * boost;
  s.score.yokai += d * (P.yokai[r] || 0) * boost;
  if (sp === 2) s.score.elec += d * P.elecFast * (up ? P.elecUp : 1) * boost;
  s.bellyRun = r === 'belly' ? s.bellyRun + d : 0; const inBelly = s.bellyRun > P.bellyRun;
  if (inBelly) s.score.angry += d * P.angryBelly * boost;
  // 往復（向きが反対になった）
  const dir = [dx / d, dy / d];
  const back = s.prevDir && dir[0] * s.prevDir[0] + dir[1] * s.prevDir[1] < -.3;
  if (back && s.segLen > 4){ s.nade++; s.segLen = 0; }   // 往復1回＝1なで
  s.segLen += d;
  if (back && sp === 2) s.score.elec += P.elecRev * boost;
  s.prevDir = dir;
  // 気持ち
  if (sp < 2 && !up) s.purr = Math.min(100, s.purr + d * (P.purrGain[r] || 0));
  s.irr += d * ((inBelly ? P.irrBelly : 0) + (sp === 2 ? P.irrFast : 0) + (up ? P.irrUp : 0));
  s.purrPeak = Math.max(s.purrPeak, s.purr);
  if (s.irr >= 100){ s.irr = 30; s.punch++; s.score.angry += P.punchAngry; s.lock = P.punchLock; s.punched = true; }
  s.irrPeak = Math.max(s.irrPeak, s.irr);
}
function simDown(s){ if (s.over) return; s.down = true; s.stroke = { len:0, t:s.t }; s.prevDir = null; s.prevAng = null; s.lastTouch = s.t; }
function simUp(s, u, v){
  if (!s.stroke) return; const st = s.stroke; s.stroke = null; s.down = false; s.lastTouch = s.t;
  if (s.over) return;
  if (st.len > 2){ s.strokes++; if (s.segLen > 4) s.nade++; s.segLen = 0; }
  if (s.t - st.t < .22 && st.len < 3){ s.taps++; const r = region(u, v); if (r) s.tapRegions[r] = 1; }
  if (st.len > P.longStrokeMin && s.lock <= 0) s.score.long += (st.len - P.longStrokeMin * .8) * P.longStroke * (1 + s.purr / 100 * P.purrBoost);
}
function simTick(s, dt){
  if (!s.started || s.over) return;
  s.t += dt; s.lock = Math.max(0, s.lock - dt);
  if (!s.down){ if (s.t - s.lastTouch > P.idleGrace) s.score.idle += P.idleRate * dt; s.purr = Math.max(0, s.purr - P.purrDecay * dt); }
  s.irr = Math.max(0, s.irr - P.irrDecay * dt);
  const lv = liveForm(s); s.line = lv.line; s.stage = lv.stage; s.form = lv.form;
  if (s.t >= P.time){ s.t = P.time; s.over = true; }
}
function liveForm(s){
  let best = 'melt'; for (const k of SYS) if (s.score[k] > s.score[best]) best = k;
  let line = best, val = s.score[best], th = P.stage;
  if (s.score.idle > val && s.started){ line = 'idle'; val = s.score.idle; th = P.idleStage; }
  let stage = 0; for (let i = 0; i < th.length; i++) if (val >= th[i]) stage = i + 1;
  if (!stage) return { line:'start', stage:0, form:'normal' };
  return { line, stage, form: LINE_FORMS[line][stage - 1] };
}
// 時間切れのときの最終判定（隠し・ミームが上書きする）
function finalForm(s){
  const mn = Math.min(...SYS.map(k => s.score[k]));
  const idleEnd = s.down ? 0 : s.t - s.lastTouch;
  const tr = s.tapRegions, allTap = ['ear','head','chin','body','belly'].every(k => tr[k]);
  if (mn >= P.gainen) return { form:'gainen', why:'全部の系統をまんべんなく、たっぷり' };
  if (mn >= P.uchu) return { form:'uchu', why:'全部の系統をまんべんなく' };
  if (s.still >= P.memeStill) return { form:'magao', why:'じっと押さえ続けた' };
  if (Math.abs(s.spin) >= P.memeSpinTurns * 2 * Math.PI) return { form:'spin', why:'ぐるぐる円を描いた' };
  if (allTap) return { form:'yoshi', why:'耳・頭・あご・胴・お腹を全部タップ' };
  if (s.punch >= P.memePunch) return { form:'banana', why:`猫パンチを${s.punch}回くらった` };
  if (s.taps >= P.memeTaps) return { form:'pop', why:'ポンポン連打した' };
  if (s.purrPeak >= P.memeNakiPurr && idleEnd >= P.memeNakiIdle) return { form:'naki', why:'気持ちよくさせて、急にやめた' };
  const many = Object.values(s.regionDist).filter(v => v >= 15).length;
  if (s.purr >= P.memeHappyPurr && s.irrPeak < P.memeHappyIrr && many >= P.memeHappyRegions && liveForm(s).stage <= 1) return { form:'happy', why:'いろんな所を、ちょうどよく' };
  if (s.dist >= P.memeJouhinDist && s.maxV < P.memeJouhinMaxV && s.regionDist.head >= s.dist * P.memeJouhinHead) return { form:'jouhin', why:'頭だけを、ゆっくりやさしく' };
  const lv = liveForm(s); return { form: lv.form, why:null };
}
/*SIM-END*/

// ---------- 画面 ----------
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const FORM = id => FORMS.find(f => f.id === id);
const LINE = key => LINES.find(l => l.key === key);
const SYS_LABEL = { melt:'とろけ', long:'のびる', yokai:'妖', elec:'帯電', angry:'怒り', idle:'放置' };
const SYS_COLOR = { melt:'#6fb3e0', long:'#c9a25a', yokai:'#9a7fd6', elec:'#e6b800', angry:'#d94b3d', idle:'#9b8f84' };
const REGION_LABEL = { ear:'耳', head:'頭', chin:'あご', body:'胴', belly:'お腹' };

let style = LS.get('neko_style', 'std'); if (!STYLES.find(s => s.id === style)) style = 'std';
let sound = LS.get('neko_sound', true);
let S, phase = 'ready', view = { s:6, ox:0, oy:0 }, shake = 0, parts = [], evoFlash = 0, prevForm = 'normal', resultInfo = null;

// 線のゲージ
const linesEl = $('lines'); const bars = {};
for (const k of [...SYS, 'idle']){ const d = document.createElement('div'); d.className = 'g'; d.innerHTML = `<span>${SYS_LABEL[k]}</span><div class="bar"><i style="--c:${SYS_COLOR[k]}"></i></div>`; linesEl.appendChild(d); bars[k] = { el:d, i:d.querySelector('i') }; }

// ---------- 絵のキャッシュ ----------
const cache = new Map();
function sprite(id, f, coat, scale, opt = {}){
  const k = `${id}|${f}|${coat}|${style}|${scale}|${opt.silhouette || ''}`; let c = cache.get(k);
  if (!c){ c = drawStyled(render(id, 48, f, coat), scale, style, { noBg:true, ...opt }); cache.set(k, c); if (cache.size > 400) cache.delete(cache.keys().next().value); }
  return c;
}

// ---------- 大きさ ----------
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const top = $('hud').getBoundingClientRect().bottom + 8, bottom = $('ctrl').getBoundingClientRect().top - 8;
  const avail = Math.min(W - 24, bottom - top);
  const s = Math.max(2, Math.floor(avail * DPR / 48));   // 実ピクセルで整数倍（ドットを崩さない）
  view.s = s; view.size = 48 * s / DPR; view.ox = (W - view.size) / 2; view.oy = top + (bottom - top - view.size) / 2;
}
addEventListener('resize', resize);

// ---------- 音（Web Audio で合成） ----------
let AC = null, master, purrG, purrLfo, rustleG, rustleF, noiseBuf;
function audioInit(){
  if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)({ latencyHint:.06 }); } catch(e){ return; }
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
  master = AC.createGain(); master.gain.value = sound ? .9 : 0; comp.connect(master); master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = noiseBuf.getChannelData(0); let b = 0; for (let i = 0; i < d.length; i++){ const w = Math.random() * 2 - 1; b = (b + .02 * w) / 1.02; d[i] = b * 3.5; }

const PAT = {

}
